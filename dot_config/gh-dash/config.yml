# gh-dash: https://www.gh-dash.dev/configuration/
# Filters use GitHub search syntax. `review-requested:@me` also matches old
# team requests (some from 2023), so direct and team requests are split.
prSections:
  - title: Review Requested
    filters: is:open user-review-requested:@me -author:@me
  - title: My PRs
    filters: is:open author:@me
  - title: Team Financeiro
    filters: is:open team-review-requested:melhorenvio/financeiro -author:@me
  - title: Involved
    filters: is:open involves:@me -author:@me -review-requested:@me
  - title: Merged
    filters: is:merged author:@me sort:updated-desc
    limit: 10
issuesSections:
  - title: My Issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me
notificationsSections:
  - title: All
    filters: ""
  - title: Review Requested
    filters: reason:review-requested
  - title: Mentions
    filters: reason:mention
  - title: Participating
    filters: reason:participating
defaults:
  view: prs
  prsLimit: 20
  # Approve without the default "LGTM" comment already filled in.
  prApproveComment: ""
  issuesLimit: 20
  notificationsLimit: 20
  refetchIntervalMinutes: 5
  preview:
    open: true
    width: 0.45
  layout:
    prs:
      repo:
        width: 20
      lines:
        width: 15
      base:
        hidden: true
# Where `gh-dash` finds local clones for checkout (key: c).
repoPaths:
  melhorenvio/devenv: ~/Projects/devenv
  melhorenvio/melhorenvio: ~/Projects/devenv/projects/melhorenvio/repositories/melhorenvio
  melhorenvio/melhorenvio-dash: ~/Projects/devenv/projects/melhorenvio/repositories/melhorenvio-dash
  melhorenvio/*: ~/Projects/*
  tsantos8080/*: ~/Projects/*
pager:
  # gh-dash turns "delta" into "delta --paging always", so the diff stays open.
  # Options come from the [delta] section in ~/.gitconfig.
  diff: delta
showAuthorIcons: true
# Show every repo at launch, even when opened inside a repository (t toggles the
# filter to the current repo).
smartFilteringAtLaunch: false
confirmQuit: false
# Uppercase keys: most lowercase ones (and R = refresh all) are built-ins.
keybindings:
  # Assign and unassign are unused here too (a and A in the issues view).
  issues:
    - key: f19
      builtin: assign
    - key: f20
      builtin: unassign
  prs:
    # Approve on a (default v). gh-dash cannot unbind a built-in, so assign
    # and unassign (a and A by default, unused) get keys no one presses: f19
    # and f20. They must differ: gh-dash merges keybindings by key,
    # so two built-ins on the same key keep only the last one.
    - key: a
      builtin: approve
    - key: f19
      builtin: assign
    - key: f20
      builtin: unassign
    - key: O
      name: review in nvim (octo)
      # In the local clone when there is one, so gf opens the real file.
      command: ~/.config/gh-dash/scripts/tmux-run.sh octo {{.PrNumber}} sh -c 'cd "{{.RepoPath}}" 2>/dev/null; exec nvim octo://{{.RepoName}}/pull/{{.PrNumber}}'
    - key: I
      name: review with Claude
      command: ~/.config/gh-dash/scripts/tmux-run.sh review {{.PrNumber}} ~/.config/gh-dash/scripts/review.sh {{.RepoPath}} {{.PrNumber}}
    - key: S
      name: summarize with Claude
      command: ~/.config/gh-dash/scripts/tmux-run.sh summary {{.PrNumber}} ~/.config/gh-dash/scripts/summary.sh {{.RepoName}} {{.PrNumber}}
    - key: J
      name: open in Jira
      command: ~/.config/gh-dash/scripts/jira.sh {{.HeadRefName}}
    - key: E
      name: explain CI failures with Claude
      command: ~/.config/gh-dash/scripts/tmux-run.sh ci {{.PrNumber}} ~/.config/gh-dash/scripts/ci-failures.sh {{.RepoName}} {{.PrNumber}}
    - key: F
      name: fix review comments (worktree)
      command: ~/.config/gh-dash/scripts/tmux-run.sh fix {{.PrNumber}} ~/.config/gh-dash/scripts/fix-comments.sh {{.RepoPath}} {{.RepoName}} {{.PrNumber}} {{.HeadRefName}}
