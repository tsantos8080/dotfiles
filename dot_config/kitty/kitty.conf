clipboard_control write-clipboard write-primary no-append

# ===== Look =====
font_family          JetBrainsMono Nerd Font
font_size            11.5
window_padding_width 8
background_opacity   0.95
# Lets ctrl+shift+a then m/l change the opacity live, and reloads apply it.
dynamic_background_opacity yes
# Short trail when the cursor jumps, to spot where it landed.
cursor_trail         3
cursor_trail_decay   0.1 0.4
# Generated by `kitten themes` (Kanagawa Dragon).
include current-theme.conf

# No "Are you sure?" on close: work lives in tmux, closing only detaches.
confirm_os_window_close 0

# Open straight into the tmux session "main" (attach or create). Detaching
# (prefix + d) drops to a plain zsh in the same window instead of closing it,
# which also covers tmux failing to start.
shell zsh -c 'tmux new -A -s main; exec zsh'
