clipboard_control write-clipboard write-primary no-append

# ===== Look =====
font_family          JetBrainsMono Nerd Font
font_size            11.5
window_padding_width 8
background_opacity   0.95
# Lets ctrl+shift+a then m/l change the opacity live, and reloads apply it.
dynamic_background_opacity yes

# Wired: the wallpaper inside the terminal, darkened by the tint so the text
# stays readable (1.0 = image hidden, 0.0 = image at full strength).
background_image        ~/Pictures/Wallpapers/ad725e53b3ee8f7a8fc1675f075bd39a.jpg
background_image_layout cscaled
background_tint         0.985
background_tint_gaps    1.0
# Short trail when the cursor jumps, to spot where it landed.
cursor_trail         3
cursor_trail_decay   0.1 0.4
# Generated by `kitten themes` (Kanagawa Dragon).
include current-theme.conf

# No "Are you sure?" on close: work lives in tmux, closing only detaches.
confirm_os_window_close 0

# Open straight into the tmux session "main" (attach or create). Detaching
# (prefix + d) drops to a plain zsh in the same window instead of closing it,
# which also covers tmux failing to start.
shell zsh -c 'tmux new -A -s main; exec zsh'

# Hints that only copy to the clipboard: ctrl+shift+y ("yank") then
# u (URL), f (path), h (commit hash), w (word) or l (line).
map kitty_mod+y>u kitten hints --type url --program @
map kitty_mod+y>f kitten hints --type path --program @
map kitty_mod+y>h kitten hints --type hash --program @
map kitty_mod+y>w kitten hints --type word --program @
map kitty_mod+y>l kitten hints --type line --program @
