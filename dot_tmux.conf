# ===== Vi mode for copy-mode =====
setw -g mode-keys vi

# ===== Pane navigation with hjkl (vim-style) =====
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ===== Resize panes with HJKL =====
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ===== More intuitive pane splitting =====
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ===== New window in the same directory =====
bind c new-window -c "#{pane_current_path}"

# ===== Vim-style copy mode (selection and yank) =====
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Enter copy-mode with prefix + Escape (feels more vim-like)
bind Escape copy-mode

# ===== Quality of life =====
set -g mouse on                  # enable mouse for scrolling/selection too
set -g base-index 1              # windows start at 1, not 0
setw -g pane-base-index 1
set -sg escape-time 0            # no delay on Esc (important for vim users)
set -g history-limit 10000
set -g renumber-windows on
set -g focus-events on            # lets nvim reload files changed elsewhere

# ===== Copy =====
set -g set-clipboard on

# Quickly reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ===== Colors =====
# True color inside tmux (TERM was "screen", limited to 256 colors).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# ===== Status bar (Kanagawa Dragon) =====
set -g status-style "bg=default,fg=#a6a69c"
set -g status-left "#[fg=#c4b28a,bold] #S  "
set -g status-left-length 30
# Git branch of the current pane (only the Jira key when there is one).
set -g status-right "#[fg=#8ba4b0]#(~/.local/bin/tmux-git-branch '#{pane_current_path}')#[fg=#737c73]%H:%M "
set -g status-right-length 60
set -g status-interval 5
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=#181616,bg=#c4b28a,bold] #I #W "
set -g pane-border-style "fg=#282727"
set -g pane-active-border-style "fg=#c4b28a"
set -g message-style "bg=#282727,fg=#c5c9c5"
set -g mode-style "bg=#2d4f67,fg=#c8c093"

# ===== Switch windows without the prefix =====
# Left Alt + number, one hand. Right Alt is AltGr in the us alt-intl layout.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
# WASD with the left Alt (Alt+` would be nicer but GNOME uses it):
#   A / D: previous / next window
#   W: back to the last used window
#   S: window list with preview
bind -n M-a previous-window
bind -n M-d next-window
bind -n M-w last-window
bind -n M-s choose-tree -Zw

# Alt+F: find a window by typing (fzf in a popup).
bind -n M-f display-popup -E -w 70% -h 50% "~/.local/bin/tmux-find-window"

# Alt+R: rename the current window in a popup, like Alt+F.
# run-shell expands #{window_id}; display-popup in tmux 3.2 does not.
bind -n M-r run-shell "tmux display-popup -E -w 50% -h 3 '~/.local/bin/tmux-rename-window #{window_id}'"

# Alt+X: close the current window, confirming in a popup.
bind -n M-x run-shell "tmux display-popup -E -w 50% -h 7 '~/.local/bin/tmux-close-window #{window_id}'"

# Alt+N: new window in the current folder, asking for its name in a popup
# (empty keeps the automatic name). Alt+T felt like the browser's reopen tab.
bind -n M-n run-shell "tmux display-popup -E -w 50% -h 3 '~/.local/bin/tmux-new-window #{pane_id}'"

# Alt+Shift+A / Alt+Shift+D: move the current window left / right
# (-d keeps the focus on the moved window).
bind -n M-A swap-window -d -t -1
bind -n M-D swap-window -d -t +1
